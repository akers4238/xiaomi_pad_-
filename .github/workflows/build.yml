name: 构建 Magisk 模块

run-name: 构建 Magisk 模块 (${{ inputs.rom }})

on:
  workflow_dispatch:
    inputs:
      rom:
        description: 'ROM 版本号 (e.g., OS2.0.202.0.VOZCNXM)'
        required: true
      url:
        description: 'ROM 下载链接'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 克隆仓库
        uses: actions/checkout@main

      - name: 🛠 安装依赖
        run: |
          sudo apt update
          sudo apt-get install -y zip unzip

      - name: 🧪 构建模块
        run: |
          bash ./build.sh --rom "${{ github.event.inputs.rom }}" \
                          --url "${{ github.event.inputs.url }}"

      - name: 🚀 发布到 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.rom }}
          name: ${{ github.event.inputs.rom }}
          body: "Magisk 模块构建：${{ github.event.inputs.rom }}"
          files: ${{ github.event.inputs.rom }}.zip

